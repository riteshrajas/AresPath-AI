<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AresPath — Mars Globe</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#05080e;color:#f8fafc;font-family:system-ui,sans-serif}#canvas-container{position:fixed;inset:0}canvas{display:block;touch-action:none}header{position:absolute;top:28px;left:28px;pointer-events:none}h1{margin:0;font-size:17px;font-weight:750;letter-spacing:2px;color:#ff8c73}.subtitle{margin:7px 0 14px;font-size:12px;color:#a3abb9}.globe-label{display:inline-block;margin:0;padding:5px 10px;border:1px solid #46505e;border-radius:20px;background:#111820aa;color:#d9e0e8;font-size:11px}.turbo-toggle{margin-left:6px;padding:5px 9px;border:1px solid #46505e;border-radius:20px;background:#111820aa;color:#d9e0e8;font:inherit;font-size:11px;cursor:pointer;pointer-events:auto}.turbo-toggle.active{border-color:#d67855;color:#ffd0bd;background:#3b1d18aa}footer{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#05080e99;padding:8px 12px;border-radius:20px;color:#b0b6c2;font-size:12px;text-align:center;white-space:nowrap;pointer-events:none}#error{position:absolute;bottom:65px;left:24px;right:24px;color:#ffc5b3;text-align:center;pointer-events:none}@media(max-width:600px){header{top:20px;left:20px}footer{width:90%;white-space:normal}}
</style>
<style>#loading-status{position:absolute;bottom:24px;left:24px;margin:0;padding:7px 10px;border:1px solid #394555;border-radius:14px;background:#05080ecc;color:#c7ced8;font-size:11px;pointer-events:none}#loading-status.loading{color:#ffd0bd;border-color:#7b5147}#loading-status.ready{color:#b9d8c5;border-color:#3c6250}@media(max-width:600px){#loading-status{left:14px;bottom:72px}}</style>
</head>
<body>
<div id="canvas-container"></div>
<header><h1>ARESPATH</h1><p class="subtitle">Mars · global terrain explorer</p><span class="globe-label">Mars globe</span><button id="turbo-toggle" class="turbo-toggle" type="button">Turbo mode</button></header>
<script>const rt=document.createElement('button');rt.id='rt-toggle';rt.className='turbo-toggle';rt.type='button';rt.textContent='RT';rt.setAttribute('aria-pressed','false');rt.title='Real-time NASA sky and sunlight';document.querySelector('header').appendChild(rt);</script>
<script>const shading=document.createElement('button');shading.id='terrain-shading-toggle';shading.type='button';shading.className='turbo-toggle';shading.textContent='Terrain lighting';shading.setAttribute('aria-pressed','true');shading.title='Angled exploration lighting and terrain-cast shadows. RT uses the real Sun direction. Explore a surface location to see the effect.';document.querySelector('header').appendChild(shading);</script>
<footer>Drag to orbit · Scroll to zoom · Double-click to explore · <span id="range">Orbital view</span></footer>
<p id="loading-status" role="status" aria-live="polite">Mars globe ready</p>
<p id="error" role="alert"></p>
<script type="module" src="/src/globe.js"></script>
</body>
</html>
