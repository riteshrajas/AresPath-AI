<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AresPath — Mars Globe</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#05080e;color:#f8fafc;font-family:system-ui,sans-serif}#canvas-container{position:fixed;inset:0}canvas{display:block;touch-action:none}header{position:absolute;top:28px;left:28px;pointer-events:none}h1{margin:0;font-size:17px;font-weight:750;letter-spacing:2px;color:#ff8c73}.subtitle{margin:7px 0 14px;font-size:12px;color:#a3abb9}.globe-label{display:inline-block;margin:0;padding:5px 10px;border:1px solid #46505e;border-radius:20px;background:#111820aa;color:#d9e0e8;font-size:11px}footer{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#05080e99;padding:8px 12px;border-radius:20px;color:#b0b6c2;font-size:12px;text-align:center;white-space:nowrap;pointer-events:none}#error{position:absolute;bottom:65px;left:24px;right:24px;color:#ffc5b3;text-align:center;pointer-events:none}@media(max-width:600px){header{top:20px;left:20px}footer{width:90%;white-space:normal}}
</style>
</head>
<body>
<div id="canvas-container"></div>
<header><h1>ARESPATH</h1><p class="subtitle">Mars · global terrain explorer</p><p class="globe-label">Mars globe</p></header>
<footer>Drag to orbit · Scroll to zoom · Double-click to explore · <span id="range">Orbital view</span></footer>
<p id="error" role="alert"></p>
<script type="module" src="/src/globe.js"></script>
</body>
</html>
