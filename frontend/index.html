<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AresPath — Mars Globe</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#020306;color:#f8fafc;font-family:system-ui,sans-serif}#canvas-container{position:fixed;inset:0}canvas{display:block;touch-action:none}header{position:absolute;top:24px;left:28px;pointer-events:auto}h1{margin:0;font-size:19px;font-weight:750;letter-spacing:2px;color:#ff8c73}header p{margin:7px 0 0;font-size:12px;letter-spacing:1px;color:#a3abb9}footer{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:#b0b6c2;font-size:12px;text-align:center;white-space:nowrap;pointer-events:none}#error{position:absolute;bottom:55px;left:24px;right:24px;color:#ffc5b3;text-align:center}@media(max-width:600px){header{top:20px;left:20px}footer{width:90%;white-space:normal}}
nav{display:flex;gap:8px;margin-top:14px}button{border:1px solid #56616d;background:#111820cc;color:#d9e0e8;padding:7px 14px;border-radius:20px;cursor:pointer}button[aria-pressed="true"]{border-color:#dd8f6b;color:#ffb796}button:disabled{opacity:.5;cursor:wait}#source{display:inline-block;margin-top:10px;color:#b1c7dc;font-size:12px}#source[hidden]{display:none}#status{max-width:min(520px,85vw);line-height:1.5;text-transform:none;letter-spacing:0}
.tool-link{color:#b1c7dc;padding:7px 12px;font-size:12px}</style>
<style>
#detail{font-size:12px;color:#a9b6c6;max-width:min(520px,85vw);line-height:1.5}#location-form{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}#location-form label{font-size:10px;color:#a9b6c6;display:grid;gap:4px}input{width:112px;border:1px solid #475364;border-radius:6px;background:#111820dd;color:#f3f4f6;padding:7px;font:inherit}#location-form button{align-self:end;border-radius:6px}header{background:linear-gradient(130deg,#05080ed9,#05080e88);padding:16px;border:1px solid #35405277;border-radius:12px;top:20px;left:20px}header h1{font-size:16px}nav{flex-wrap:wrap}footer{background:#05080e99;padding:8px 12px;border-radius:20px}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ffb796;outline-offset:3px}@media(max-width:600px){header{max-width:calc(100vw - 24px);left:12px;top:12px;padding:12px}#detail{max-width:280px}input{width:100px}}
</style>

</head>
<body>
<div id="canvas-container"></div>
<header><h1>ARESPATH</h1><p id="status" role="status">Loading Mars…</p><nav aria-label="Terrain locations"><button data-site="mars" disabled aria-pressed="true">Mars</button><button data-site="jezero" disabled aria-pressed="false">Jezero</button><button data-site="gale" disabled aria-pressed="false">Gale</button><a href="/tiles.html" class="tool-link">Terrain tiles</a></nav><p id="detail" role="status"></p><form id="location-form"><label>Longitude east<input id="longitude" type="number" min="-180" max="180" step="any" value="138.34979" required></label><label>Latitude<input id="latitude" type="number" min="-90" max="90" step="any" value="-4.92363" required></label><button type="submit" disabled>Explore</button></form><a id="source" hidden target="_blank" rel="noopener">Elevation source and measurements</a></header>
<footer>Drag to orbit · Scroll to zoom · Double-click to explore · <span id="range">Orbital view</span></footer>
<p id="error" role="alert"></p>
<script type="module" src="/src/globe.js"></script>
</body>
</html>
